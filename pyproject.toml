[tool.poetry]
name = "git-ai"
version = "0.1.0"
description = "Local AI Git Reviewer and Commit Generator using Ollama"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "git_reviewer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = {extras = ["all"], version = "^0.12.0"}
click = "8.1.3"
rich = "^13.7.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
git-ai = "git_reviewer.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
